<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My Core application</title><link rel="stylesheet" href="/style.css"></head>
<body><main>
  <p class="eyebrow">BUILT WITH NCE CORE</p><h1>Your next idea starts here.</h1>
  <p>This application has its own home and shares your Core account.</p>
  <div class="actions"><button id="signin">Sign in</button><button id="signup" class="secondary">Create account with invitation</button><button id="signout" class="secondary" hidden>Sign out</button></div>
  <p id="status" role="status">Ready when you are.</p>
  <section id="notes" hidden><h2>Your private note</h2><label for="note">A small place to test your application permissions</label><textarea id="note" maxlength="2000" rows="5"></textarea><button id="save">Save note</button></section>
  <p class="hint">Access and roles are granted by your organization administrator in Core.</p>
</main><script type="module" src="/app.js"></script></body></html>
