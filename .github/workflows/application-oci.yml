name: NCE application Helm OCI release
on:
  workflow_dispatch:
    inputs:
      application_commit:
        description: Exact application commit with successful required push CI
        required: true
        type: string
      mode:
        type: choice
        options: [verify, publish]
        default: verify
permissions:
  contents: read
  id-token: write
concurrency:
  group: nce-proposal-oci-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: nce-oci-production
    steps:
      - name: Check out the exact Core controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Obtain short-lived AWS dispatcher credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: arn:aws:iam::015454941623:role/nce-proposal-oci-dispatch
          aws-region: us-east-1
          role-duration-seconds: 7200
          allowed-account-ids: '015454941623'
      - name: Run the reviewed pipeline in NCE CodeBuild
        env:
          APPLICATION_COMMIT: ${{ inputs.application_commit }}
          RUNNER_COMMIT: ${{ github.sha }}
          RELEASE_MODE: ${{ inputs.mode }}
        run: |
          python3 ci/dispatch_oci_build.py \
            --application-commit "$APPLICATION_COMMIT" \
            --runner-commit "$RUNNER_COMMIT" --mode "$RELEASE_MODE"
