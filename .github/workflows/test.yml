name: Core platform tests
# Manual runs only: publishing source must not consume billable Actions minutes.
on: [workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: core_test
          POSTGRES_PASSWORD: ci-only-database-password
          POSTGRES_DB: core_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U core_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CORE_DEBUG: '1'
      DATABASE_URL: postgresql://core_test:ci-only-database-password@localhost:5432/core_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install uv==0.12.19
      - run: uv sync --frozen
      - run: uv run python scripts/init_dev.py
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run python manage.py test identity.tests platform_services.tests
