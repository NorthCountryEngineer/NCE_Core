{
  "name": "Core CI",
  "on": {
    "pull_request": {},
    "push": {},
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "core-verify-${{ github.event_name }}-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "verify": {
      "name": "Core required checks",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "env": {
        "CORE_CI_CONFIG": "ci/environments/example.json",
        "CORE_CI_MODE": "verify",
        "CORE_CI_ALLOW_PUBLISH": "0",
        "CORE_CI_ALLOW_DEPLOY": "0",
        "AWS_EC2_METADATA_DISABLED": "true"
      },
      "steps": [
        {
          "name": "Check out the event commit",
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803",
          "with": {
            "fetch-depth": 0,
            "persist-credentials": false
          }
        },
        {
          "name": "Set up Python 3.12",
          "uses": "actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "name": "Install checksum-pinned Helm and Kubernetes validator",
          "run": "python3 ci/install_oci_tools.py --validation-only\necho /tmp/nce-oci-tools >> \"$GITHUB_PATH\""
        },
        {
          "name": "Verify AWS source-build and container isolation offline",
          "run": "python3 deployment/aws-platform/check_template.py"
        },
        {
          "name": "Check, test with disposable PostgreSQL, and build the image",
          "run": "python3 ci/verify_with_postgres.py"
        },
        {
          "name": "Render and lint OCI application chart offline",
          "run": "set -euo pipefail\n.venv/bin/python - <<'CHECK'\nfrom ci.oci_release import generate_chart, load_config, validate_chart\nfrom tempfile import TemporaryDirectory\nc = load_config('ci/applications/proposal-studio.example.json')\nimages = {name: item['repository'] + '@sha256:' + 'c' * 64 for name, item in c['images'].items()}\nwith TemporaryDirectory() as tmp:\n    chart, version = generate_chart(c, images, 'a' * 40, 'b' * 40, tmp)\n    print(validate_chart(c, chart, version))\nCHECK"
        }
      ]
    }
  }
}
