{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "nce.name" . }}
  labels:
    {{- include "nce.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ required "Ingress class required" .Values.ingress.className | quote }}
  tls:
    - hosts: [{{ required "Ingress host required" .Values.ingress.host | quote }}]
      secretName: {{ required "Existing TLS secret required" .Values.ingress.tlsSecret | quote }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "nce.name" . }}-web
                port: {name: http}
{{- end }}
